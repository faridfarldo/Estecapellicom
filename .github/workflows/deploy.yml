name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Pull + Deploy on cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call cPanel UAPI VersionControl::update + VersionControlDeployment::create
        env:
          CPANEL_HOST:      ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME:  ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN:     ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          set -euo pipefail

          for var in CPANEL_HOST CPANEL_USERNAME CPANEL_TOKEN CPANEL_REPO_ROOT; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done

          # Strip CR/LF + leading/trailing whitespace — paste-from-clipboard artefacts
          # often leave a trailing newline in GitHub secrets which then breaks the API
          # (cPanel rejects ".../estecapelli\n" as "not a valid repository_root").
          strip_ws() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's:^[[:space:]]+|[[:space:]]+$::g'; }
          CPANEL_HOST=$(strip_ws "$CPANEL_HOST")
          CPANEL_USERNAME=$(strip_ws "$CPANEL_USERNAME")
          CPANEL_TOKEN=$(strip_ws "$CPANEL_TOKEN")
          CPANEL_REPO_ROOT=$(strip_ws "$CPANEL_REPO_ROOT")

          encoded_path=$(printf '%s' "$CPANEL_REPO_ROOT" | jq -sRr @uri)
          auth_header="Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_TOKEN}"

          call_api() {
            local endpoint="$1"
            local label="$2"
            local response_file
            response_file=$(mktemp)

            local http_code
            local curl_status
            set +e
            http_code=$(curl --silent --show-error \
              --max-time 120 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              -H "$auth_header" \
              "https://${CPANEL_HOST}/execute/${endpoint}?repository_root=${encoded_path}")
            curl_status=$?
            set -e

            # Some account-specific cPanel hostnames use a service certificate
            # that GitHub's runner cannot validate (curl 60). The public domain
            # endpoint has a valid certificate but cPanel rejects this account's
            # API token there with HTTP 403, so retry only this certificate error
            # against the original HTTPS endpoint with verification disabled.
            if [ "$curl_status" -eq 60 ]; then
              echo "::warning::cPanel service certificate could not be validated; retrying the account-specific HTTPS endpoint"
              http_code=$(curl --silent --show-error --insecure \
                --max-time 120 \
                --output "$response_file" \
                --write-out "%{http_code}" \
                -H "$auth_header" \
                "https://${CPANEL_HOST}/execute/${endpoint}?repository_root=${encoded_path}")
              curl_status=$?
            fi

            if [ "$curl_status" -ne 0 ]; then
              echo "::error::${label} curl failed with exit code ${curl_status}"
              return 1
            fi

            echo "::group::${label} (HTTP $http_code)"
            cat "$response_file"
            echo
            echo "::endgroup::"

            if [ "$http_code" != "200" ]; then
              echo "::error::${label} returned HTTP $http_code"
              return 1
            fi

            if ! jq -e '.status == 1' "$response_file" > /dev/null 2>&1; then
              echo "::error::${label} reported status != 1"
              jq '.errors // .messages // .' "$response_file" || true
              return 1
            fi

            return 0
          }

          call_api "VersionControl/update" "Step 1: VersionControl::update (git fetch + fast-forward)"

          # Brief pause so cPanel can register the fetched commits before deploying
          sleep 2

          call_api "VersionControlDeployment/create" "Step 2: VersionControlDeployment::create (deploy HEAD)"

          echo "::notice::cPanel pulled + deployed successfully"
